syntax="proto3";

package f1x.aasdk.proto.data;

// Discovery declaration of the InputSource channel (AAP 1.6+).
// Minimal shape: keycodes + touchscreens. Touchpads, feedback events and
// display_id exist in the reference but are sent by nobody on the HU side,
// so they are omitted (cf. R6 of the design doc).
message InputSourceTouchScreen
{
    uint32 width = 1;
    uint32 height = 2;
}

message InputSourceChannel
{
    repeated int32 keycodes_supported = 1;
    repeated InputSourceTouchScreen touchscreen = 2;
}
