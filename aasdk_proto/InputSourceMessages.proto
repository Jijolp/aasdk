syntax="proto3";

package f1x.aasdk.proto.inputsource;

// InputReport envelope for the InputSource channel (AAP 1.6+).
// Field numbers and types match the reference implementation
// (touch_event = 3, key_event = 4, relative_event = 6); the deprecated
// disp field, absolute_event and touchpad_event are intentionally omitted
// (sent by nobody, verified on the reference HU side).
enum PointerAction
{
    ACTION_DOWN = 0;
    ACTION_UP = 1;
    ACTION_MOVED = 2;
    ACTION_POINTER_DOWN = 5;
    ACTION_POINTER_UP = 6;
}

// S3: scalar fields are `optional` (explicit presence). The reference uses
// proto2 with required/optional fields; plain proto3 would silently drop
// meaningful zeroes (ACTION_DOWN=0, action_index=0, metastate=0,
// longpress=false, coordinates 0) and a presence-strict phone parser would
// see them as unset. protoc 36 fully supports proto3 optional.
message Pointer
{
    optional uint32 x = 1;
    optional uint32 y = 2;
    optional uint32 pointer_id = 3;
}

message TouchEvent
{
    repeated Pointer pointer_data = 1;
    optional uint32 action_index = 2;
    optional PointerAction action = 3;
}

message KeyEvent
{
    message Key
    {
        optional uint32 keycode = 1;
        optional bool down = 2;
        optional uint32 metastate = 3;
        optional bool longpress = 4;
    }
    repeated Key keys = 1;
}

message RelativeEvent
{
    message Rel
    {
        optional uint32 keycode = 1;
        optional int32 delta = 2;
    }
    repeated Rel data = 1;
}

message InputReport
{
    optional uint64 timestamp = 1;
    TouchEvent touch_event = 3;
    KeyEvent key_event = 4;
    RelativeEvent relative_event = 6;
}
