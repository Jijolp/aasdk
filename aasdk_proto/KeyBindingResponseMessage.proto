syntax="proto3";

package f1x.aasdk.proto.messages;

// Status values mirror the shared MessageStatus table of the reference:
// 0 = success, -18 = keycode not bound.
enum KeyBindingStatus
{
    KEY_BINDING_SUCCESS = 0;
    KEY_BINDING_KEYCODE_NOT_BOUND = -18;
}

message KeyBindingResponse
{
    // S3: optional for explicit presence (0 = SUCCESS must be on the wire).
    optional int32 status = 1;
}
